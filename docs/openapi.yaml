# Dihasilkan oleh backend/tools/gen_openapi.py — jangan diedit manual.
openapi: 3.0.3
info:
  title: SmartEyeX Platform API
  version: 0.2.0
  description: 'API platform SmartEyeX (XNVA Labs): dua lingkungan terpisah (Personal dan Enterprise) di atas satu fondasi
    XNAI.

    Semua waktu dalam epoch milidetik. Semua error berbentuk {"error": {"code", "message", "request_id"}}.

    Token Personal tidak berlaku di endpoint Enterprise dan sebaliknya (HTTP 403 wrong_realm).'
servers:
- url: /
  description: Origin tempat backend di-deploy (HTTPS wajib di production)
tags:
- name: ops
- name: auth
- name: platform
- name: personal
- name: devices
- name: notifications
- name: xnai
- name: enterprise
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    platformToken:
      type: apiKey
      in: header
      name: X-Platform-Token
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
  responses:
    E400:
      description: validation_error / invalid_json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E401:
      description: unauthorized / token_expired / invalid_credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E403:
      description: forbidden / wrong_realm / disabled_by_policy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E404:
      description: not_found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E409:
      description: conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E429:
      description: rate_limited / quota_exceeded / account_locked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E503:
      description: xnai_not_configured / upstream tidak tersedia
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
paths:
  /healthz:
    get:
      summary: Liveness probe
      tags:
      - ops
      security: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '503':
          $ref: '#/components/responses/E503'
  /readyz:
    get:
      summary: Readiness probe (memeriksa integritas kedua database)
      tags:
      - ops
      security: []
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
