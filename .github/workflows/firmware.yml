name: Firmware

on:
  push:
    branches: [ main ]
    paths: [ 'firmware/**', 'docs/protocol/**', 'tools/**', 'app/src/main/java/com/xnvalabs/smarteyex/data/glasses/ProtocolIds.kt', '.github/workflows/firmware.yml' ]
  pull_request:
    paths: [ 'firmware/**', 'docs/protocol/**', 'tools/**', 'app/src/main/java/com/xnvalabs/smarteyex/data/glasses/ProtocolIds.kt', '.github/workflows/firmware.yml' ]
  workflow_dispatch:

jobs:
  host-tests:
    name: Protocol core (host build, sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generated files are up to date
        run: python3 firmware/test/test_generated.py
      - name: Host tests
        run: make -C firmware/test/host test

  build:
    name: ESP32-S3 build (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio run -d firmware -e xiao_esp32s3_sense
      - uses: actions/upload-artifact@v4
        with:
          name: smarteyex-glasses-firmware
          path: firmware/.pio/build/xiao_esp32s3_sense/firmware.bin
