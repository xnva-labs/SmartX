; Build: pio run -e xiao_esp32s3_sense      Flash: pio run -e xiao_esp32s3_sense -t upload
; Tes host (tanpa perangkat): make -C test/host test
[platformio]
default_envs = xiao_esp32s3_sense

[env:xiao_esp32s3_sense]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
build_flags =
    -DBOARD_XIAO_ESP32S3_SENSE
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -Iinclude
